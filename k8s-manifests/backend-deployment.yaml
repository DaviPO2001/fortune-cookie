apiVersion: apps/v1

kind: Deployment

metadata:
  name: backend
  namespace: default

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend

          image: 009160038179.dkr.ecr.us-east-1.amazonaws.com/registry:backend-5ec523a476e2c8ff498918c1cfd4181ff0e40f4e

          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "100Mi"
              cpu: "100m"
            limits:
              memory: "300Mi"
              cpu: "300m"
