apiVersion: apps/v1

kind: Deployment

metadata:
  name: backend
  namespace: default

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend

          image: 009160038179.dkr.ecr.us-west-2.amazonaws.com/registry:latest

          ports:
            - containerPort: 3000